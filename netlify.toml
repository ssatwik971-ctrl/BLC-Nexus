[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.12.2"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma", "@netlify/identity", "@netlify/aws-lambda-compat", "@netlify/blobs"]
  included_files = ["backend/prisma/schema.prisma"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
