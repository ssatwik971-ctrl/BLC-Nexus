# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: blc-nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blc
      POSTGRES_PASSWORD: blc_dev_password
      POSTGRES_DB: blc_nexus
    ports:
      - "5432:5432"
    volumes:
      - blc_nexus_pg:/var/lib/postgresql/data
volumes:
  blc_nexus_pg:
